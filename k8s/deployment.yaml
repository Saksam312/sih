apiVersion: apps/v1
kind: Deployment

metadata:
  name: my-dashboard

spec:
  replicas: 2

  selector:
    matchLabels:
      app: my-dashboard

  template:
    metadata:
      labels:
        app: my-dashboard

    spec:
      containers:
        - name: my-dashboard
          image: saksamgr/my-dashboard:latest
          ports:
            - containerPort: 80